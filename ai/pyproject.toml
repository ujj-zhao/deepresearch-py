[project]
name = "deepresearch-ai"
version = "0.1.0"
description = "DeepResearch AI 服务（Graph 编排多智能体深度研究，Python 重写版）"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.4",
    "pydantic-settings>=2.15.0",
]

# 依赖按路线图分阶段引入，避免骨架期依赖树过重：
#   P1 最小图核心   -> langgraph、langchain-core
#   P2 流式+人机协同 -> langgraph-checkpoint（SSE 用 FastAPI 自带 StreamingResponse）
#   P3 并行+RAG     -> sqlalchemy、pgvector、redis
#   P4 生产化       -> langfuse 或 opentelemetry-sdk

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deepresearch"]

[tool.ruff]
src = ["src"]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
